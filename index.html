<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <link rel="stylesheet" href="styles.css">

    <!--引入FullCalendar的JS套件(透過CDN)-->>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
    <!-- 左側：網站名稱 + 導覽選單 -->
    <aside class="sidebar">
        <div class="brand">
            <p class="brand-name">Study Hub</p>
            <p class="brand-desc">個人學習管理</p>
        </div>

        <nav class="nav">
            <a class="nav-link is-active" href="#">儀錶板</a>
            <a class="nav-link" href="#">課程</a>
            <a class="nav-link" href="#">作業</a>
            <a class="nav-link" href="#">行事曆</a>
            <a class="nav-link" href="#">學習計時</a>
            <a class="nav-link" href="#">番茄鐘</a>
            <a class="nav-link" href="#">學習統計</a>
            <a class="nav-link" href="#">學習計畫</a>
        </nav>
    </aside>

    <!-- 右側：目前頁面內容 -->
    <main class="main">
        <header class="page-header">
            <div class="header-left">
                <!-- 收折按鈕 -->
                <button id="sidebar-toggle" class="toggle-btn">☰</button>
                <h1>Calendar</h1>
            </div>
            <!-- 日期會由 script.js 填入 -->
            <p id="today-date" class="today-date">載入日期中…</p>
        </header>

        <!-- 主要日曆區塊 -->
        <section class="page-body">
            <div id='calendar'></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
