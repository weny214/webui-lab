<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub | 個人學習管理平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入外部樣式表 -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between font-sans">

    <!-- Header / Navbar -->
    <header class="bg-[#F5EBE6] border-b border-[#E3D5C8] shadow-sm py-4 px-6 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-[#8D7B68] text-white p-2 rounded-xl shadow">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-[#4A3B32]">Study Hub</h1>
                    <p class="text-xs text-[#8D7B68]">個人學習與時間管理平台</p>
                </div>
            </div>
            <nav class="hidden md:flex space-x-2">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-[#8D7B68] text-white">總覽儀表板</button>
                <button onclick="switchTab('courses')" id="nav-courses" class="px-4 py-2 rounded-lg font-medium text-sm transition text-[#4A3B32] hover:bg-[#E3D5C8]">課程管理</button>
                <button onclick="switchTab('todos')" id="nav-todos" class="px-4 py-2 rounded-lg font-medium text-sm transition text-[#4A3B32] hover:bg-[#E3D5C8]">待辦事項</button>
                <button onclick="switchTab('calendar')" id="nav-calendar" class="px-4 py-2 rounded-lg font-medium text-sm transition text-[#4A3B32] hover:bg-[#E3D5C8]">行事曆</button>
                <button onclick="switchTab('pomodoro')" id="nav-pomodoro" class="px-4 py-2 rounded-lg font-medium text-sm transition text-[#4A3B32] hover:bg-[#E3D5C8]">番茄鐘</button>
            </nav>
        </div>
    </header>

    <!-- Mobile Nav (Bottom) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-[#F5EBE6] border-t border-[#E3D5C8] flex justify-around py-3 z-50 shadow-lg">
        <button onclick="switchTab('dashboard')" id="mob-dashboard" class="flex flex-col items-center text-xs text-[#8D7B68] font-bold"><i class="fa-solid fa-chart-pie text-lg mb-1"></i>總覽</button>
        <button onclick="switchTab('courses')" id="mob-courses" class="flex flex-col items-center text-xs text-[#4A3B32]"><i class="fa-solid fa-book text-lg mb-1"></i>課程</button>
        <button onclick="switchTab('todos')" id="mob-todos" class="flex flex-col items-center text-xs text-[#4A3B32]"><i class="fa-solid fa-list-check text-lg mb-1"></i>待辦</button>
        <button onclick="switchTab('calendar')" id="mob-calendar" class="flex flex-col items-center text-xs text-[#4A3B32]"><i class="fa-solid fa-calendar-days text-lg mb-1"></i>行事曆</button>
        <button onclick="switchTab('pomodoro')" id="mob-pomodoro" class="flex flex-col items-center text-xs text-[#4A3B32]"><i class="fa-solid fa-clock text-lg mb-1"></i>番茄鐘</button>
    </div>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow mb-16 md:mb-0">

        <!-- TAB 1: 總覽儀表板 (Dashboard) -->
        <section id="tab-dashboard" class="space-y-6">
            <div class="bg-[#F5EBE6] rounded-2xl p-6 shadow-sm border border-[#E3D5C8]">
                <h2 class="text-2xl font-bold text-[#4A3B32] mb-1">歡迎回來！今天也要保持專注 ✨</h2>
                <p class="text-sm text-[#7F6F60]">以下是您目前的學習進度與今日待辦概況。</p>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-[#E3D5C8] flex items-center justify-between">
                    <div>
                        <p class="text-xs text-stone-500 font-medium">已完成任務</p>
                        <h3 id="stat-completed" class="text-3xl font-extrabold text-[#8D7B68] mt-1">0 / 0</h3>
                    </div>
                    <div class="bg-[#F5EBE6] p-3 rounded-full text-[#8D7B68]"><i class="fa-solid fa-check-double text-xl"></i></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-[#E3D5C8] flex items-center justify-between">
                    <div>
                        <p class="text-xs text-stone-500 font-medium">註冊課程數</p>
                        <h3 id="stat-courses" class="text-3xl font-extrabold text-[#8D7B68] mt-1">0</h3>
                    </div>
                    <div class="bg-[#F5EBE6] p-3 rounded-full text-[#8D7B68]"><i class="fa-solid fa-book-open text-xl"></i></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-[#E3D5C8] flex items-center justify-between">
                    <div>
                        <p class="text-xs text-stone-500 font-medium">累積專注時間</p>
                        <h3 id="stat-focus-time" class="text-3xl font-extrabold text-[#8D7B68] mt-1">0 分鐘</h3>
                    </div>
                    <div class="bg-[#F5EBE6] p-3 rounded-full text-[#8D7B68]"><i class="fa-solid fa-stopwatch text-xl"></i></div>
                </div>
            </div>

            <!-- Quick Overview Lists -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-[#E3D5C8]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-[#4A3B32]"><i class="fa-solid fa-bell mr-2 text-[#8D7B68]"></i>近期待辦預覽</h3>
                        <button onclick="switchTab('todos')" class="text-xs text-[#8D7B68] font-semibold hover:underline">查看全部</button>
                    </div>
                    <div id="dash-todo-list" class="space-y-2"></div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-[#E3D5C8]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-[#4A3B32]"><i class="fa-solid fa-bookmark mr-2 text-[#8D7B68]"></i>我的課程清單</h3>
                        <button onclick="switchTab('courses')" class="text-xs text-[#8D7B68] font-semibold hover:underline">管理課程</button>
                    </div>
                    <div id="dash-course-list" class="space-y-2"></div>
                </div>
            </div>
        </section>

        <!-- TAB 2: 課程管理 (Courses) -->
        <section id="tab-courses" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#E3D5C8]">
                <h2 class="text-xl font-bold text-[#4A3B32] mb-4"><i class="fa-solid fa-book-bookmark mr-2 text-[#8D7B68]"></i>新增課程</h2>
                <form id="course-form" onsubmit="addCourse(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="course-name" placeholder="輸入課程名稱 (例如: 資料結構)" required class="border border-[#E3D5C8] p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8D7B68] bg-[#FDFBF7]">
                    <select id="course-color" class="border border-[#E3D5C8] p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8D7B68] bg-[#FDFBF7]">
                        <option value="#8D7B68">經典奶咖色</option>
                        <option value="#BC6C25">大地琥珀色</option>
                        <option value="#606C38">溫潤墨綠色</option>
                        <option value="#283618">深林苔綠色</option>
                    </select>
                    <button type="submit" class="bg-[#8D7B68] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#726352] transition shadow-sm">新增課程</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#E3D5C8]">
                <h2 class="text-xl font-bold text-[#4A3B32] mb-4">課程列表</h2>
                <div id="course-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>

        <!-- TAB 3: 待辦事項 (Todos) -->
        <section id="tab-todos" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#E3D5C8]">
                <h2 class="text-xl font-bold text-[#4A3B32] mb-4"><i class="fa-solid fa-list-check mr-2 text-[#8D7B68]"></i>新增學習任務</h2>
                <form id="todo-form" onsubmit="addTodo(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="todo-text" placeholder="輸入任務內容 (例如: 完成作業5)" required class="border border-[#E3D5C8] p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8D7B68] bg-[#FDFBF7] md:col-span-2">
                    <input type="date" id="todo-date" required class="border border-[#E3D5C8] p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8D7B68] bg-[#FDFBF7]">
                    <button type="submit" class="bg-[#8D7B68] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#726352] transition shadow-sm">新增任務</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#E3D5C8]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-[#4A3B32]">任務清單</h2>
                    <span id="todo-count" class="text-xs text-stone-500 font-medium">共 0 項任務</span>
                </div>
                <div id="todo-list-container" class="space-y-3"></div>
            </div>
        </section>

        <!-- TAB 4: Google 風格多檢視行事曆 (Calendar) -->
        <section id="tab-calendar" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#E3D5C8] space-y-4">
                
                <!-- 頂部導航與檢視切換列 -->
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 border-b border-[#E3D5C8] pb-4">
                    <div class="flex items-center space-x-4">
                        <h2 id="calendar-title" class="text-xl font-bold text-[#4A3B32]">2026年 10月</h2>
                        <div class="space-x-1">
                            <button onclick="navigateCalendar(-1)" class="p-2 bg-[#F5EBE6] text-[#4A3B32] rounded-lg hover:bg-[#E3D5C8] transition text-sm"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="setTodayCalendar()" class="px-3 py-1.5 bg-[#F5EBE6] text-[#4A3B32] rounded-lg hover:bg-[#E3D5C8] transition text-sm font-medium">今天</button>
                            <button onclick="navigateCalendar(1)" class="p-2 bg-[#F5EBE6] text-[#4A3B32] rounded-lg hover:bg-[#E3D5C8] transition text-sm"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>

                    <div class="flex bg-[#F5EBE6] p-1 rounded-xl">
                        <button onclick="setCalendarView('year')" id="view-btn-year" class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-[#4A3B32]">年</button>
                        <button onclick="setCalendarView('month')" id="view-btn-month" class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-[#8D7B68] text-white">月</button>
                        <button onclick="setCalendarView('week')" id="view-btn-week" class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-[#4A3B32]">週</button>
                        <button onclick="setCalendarView('day')" id="view-btn-day" class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-[#4A3B32]">日</button>
                    </div>
                </div>

                <!-- 內容檢視區塊 -->
                <div id="calendar-view-container"></div>

            </div>
        </section>

        <!-- TAB 5: 番茄鐘計時器 (Pomodoro) -->
        <section id="tab-pomodoro" class="hidden space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-[#E3D5C8] max-w-md mx-auto text-center space-y-6">
                <div class="flex justify-center space-x-2">
                    <button onclick="setTimerMode('focus')" id="mode-focus" class="px-4 py-1.5 rounded-full text-xs font-bold bg-[#8D7B68] text-white transition">專注 (25m)</button>
                    <button onclick="setTimerMode('break')" id="mode-break" class="px-4 py-1.5 rounded-full text-xs font-bold bg-[#F5EBE6] text-[#4A3B32] transition">休息 (5m)</button>
                </div>

                <div class="text-6xl md:text-7xl font-mono font-extrabold text-[#4A3B32] tracking-wider my-6" id="timer-display">
                    25:00
                </div>

                <div class="flex justify-center space-x-4">
                    <button onclick="toggleTimer()" id="timer-toggle-btn" class="bg-[#8D7B68] text-white font-bold py-3 px-8 rounded-xl hover:bg-[#726352] transition shadow-sm">開始專注</button>
                    <button onclick="resetTimer()" class="bg-[#E3D5C8] text-[#4A3B32] font-medium py-3 px-6 rounded-xl hover:bg-[#d0c2b5] transition">重設</button>
                </div>
                <p class="text-xs text-stone-500">完成一個番茄鐘將自動累積您的專注時間！</p>
            </div>
        </section>

    </main>

    <!-- 互動式新增行程 Modal 視窗 -->
    <div id="event-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-[#FDFBF7] rounded-2xl p-6 w-full max-w-md border border-[#E3D5C8] shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-[#E3D5C8] pb-3">
                <h3 class="font-bold text-lg text-[#4A3B32]"><i class="fa-solid fa-calendar-plus mr-2 text-[#8D7B68]"></i>新增時間軸行程</h3>
                <button onclick="closeEventModal()" class="text-stone-400 hover:text-stone-700"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="event-form" onsubmit="handleEventSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">行程名稱</label>
                    <input type="text" id="modal-event-title" placeholder="例如: 演算法線上討論" required class="w-full border border-[#E3D5C8] p-2.5 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#8D7B68]">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">行程類型</label>
                        <select id="modal-event-type" class="w-full border border-[#E3D5C8] p-2.5 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#8D7B68]">
                            <option value="task">作業 / 任務</option>
                            <option value="course">課程</option>
                            <option value="event">一般活動</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">重複頻率</label>
                        <select id="modal-event-repeat" class="w-full border border-[#E3D5C8] p-2.5 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#8D7B68]">
                            <option value="once">僅一次</option>
                            <option value="daily">每天重複</option>
                            <option value="weekly">每週重複</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">日期</label>
                        <input type="date" id="modal-event-date" required class="w-full border border-[#E3D5C8] p-2.5 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#8D7B68]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-600 mb-1">時間</label>
                        <input type="time" id="modal-event-time" required class="w-full border border-[#E3D5C8] p-2.5 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#8D7B68]">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeEventModal()" class="px-4 py-2 rounded-lg bg-stone-200 text-stone-700 text-sm font-medium hover:bg-stone-300 transition">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-[#8D7B68] text-white text-sm font-bold hover:bg-[#726352] transition shadow-sm">儲存行程</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-[#F5EBE6] border-t border-[#E3D5C8] text-stone-500 text-center py-4 text-xs mt-12">
        <p>Study Hub &copy; 2026 | Vibe Coding Homework 5</p>
    </footer>

    <!-- 引入外部 JavaScript 檔案 -->
    <script src="script.js"></script>
</body>
</html>
